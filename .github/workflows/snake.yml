name: generate snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3.2.0
        with:
          github_user_name: Fzcdalao
          svg_output_path: github-contribution-grid-snake.svg
